
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-self-pruning"
version = "0.1.0"
description = "NumPy-based autodiff engine and self-pruning MLP"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "nn*", "prune*", "train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
